[package]
name = "phonetic-learn"
version = "0.1.0"
description = "离线英语音标学习"
authors = ["phonetic-learn"]
edition = "2021"

[lib]
name = "phonetic_learn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
